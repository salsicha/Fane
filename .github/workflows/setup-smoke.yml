name: Setup smoke test

# Run by hand: installs Ollama with `fane setup` on clean macOS and Windows runners and
# downloads a small model (not the 18 GB default) to check the whole path works.

on:
  workflow_dispatch:
  push:
    branches: [ollama-setup]  # temporary, while this is reviewed

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: fane setup (macOS)
        if: runner.os == 'macOS'
        run: |
          target/release/fane setup --yes --model all-minilm
          target/release/fane setup --model all-minilm
          target/release/fane doctor | grep -iE "ollama|model"
      - name: fane setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # fane.exe is a GUI-subsystem program, so wait for it explicitly -- but only for fane
          # itself: `Start-Process -Wait` would also wait for the Ollama server it leaves running.
          foreach ($a in @('setup --yes --model all-minilm', 'setup --model all-minilm')) {
            $p = Start-Process -FilePath target\release\fane.exe -ArgumentList $a -NoNewWindow -PassThru
            if (-not $p.WaitForExit(1200000)) { $p.Kill(); throw "fane $a timed out" }
            if ($p.ExitCode -ne 0) { throw "fane $a failed ($($p.ExitCode))" }
          }
          (Invoke-RestMethod http://127.0.0.1:11434/api/tags).models.name

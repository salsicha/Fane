[project]
name = "fane"
version = "0.1.0"
description = "Unobtrusive, context-aware local desktop assistant for Ubuntu/GNOME"
readme = "README.md"
authors = [
    { name = "alex moran", email = "salsicha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbus-next>=0.2.3",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "pyside6>=6.12.0",
]

[project.scripts]
fane = "fane:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
